plugins {
    id 'com.android.application'
}

// Set a local deployment URL through Gradle properties.
def quotedSetting = { name, fallback ->
    def value = (project.findProperty(name) ?: fallback).toString()
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.example.vieshow"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"

        buildConfigField 'String', 'API_BASE_URL', quotedSetting('VIESHOW_API_BASE_URL', 'http://10.0.2.2/vieshow/')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.android.support:support-annotations:27.1.1'
    implementation 'org.apache.commons:commons-text:1.7'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}